name: payment-processor
x-app: &app
  build: .
  environment:
    API_KEY: ${API_KEY:?Copy .env.example to .env and set API_KEY}
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
    OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-0.5}
    WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
  init: true
  stop_grace_period: 45s
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports: ["127.0.0.1:${AMQP_PORT:-5672}:5672", "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 15s
      start_period: 20s
      retries: 20
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  consumer:
    <<: *app
    command: ["python", "-m", "app.consumer"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/payment-consumer-health').st_mtime < 30"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  postgres-data:
  rabbitmq-data:
